---
# PROD cluster — 3 managers (Raft quorum survives losing one) + 2 workers.
# Managers are drained of application work by the placement constraints in
# group_vars/all/main.yml, so a busy app can never starve the control plane.
all:
  children:
    swarm_nodes:
      children:
        managers:
          hosts:
            prod-manager-1:
              ansible_host: 10.20.1.11
              swarm_addr: 10.20.1.11
            prod-manager-2:
              ansible_host: 10.20.1.12
              swarm_addr: 10.20.1.12
            prod-manager-3:
              ansible_host: 10.20.1.13
              swarm_addr: 10.20.1.13
        workers:
          hosts:
            prod-worker-1:
              ansible_host: 10.20.2.11
              swarm_addr: 10.20.2.11
              node_labels:
                tier: app
                zone: a
            prod-worker-2:
              ansible_host: 10.20.2.12
              swarm_addr: 10.20.2.12
              node_labels:
                tier: app
                zone: b
