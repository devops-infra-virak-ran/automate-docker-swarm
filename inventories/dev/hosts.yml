---
# DEV cluster — 1 manager + 1 worker.
#
#   ansible_host : address Ansible SSHes to (public IP / DNS / bastion-reachable IP)
#   swarm_addr   : private address the nodes use to talk Swarm to each other
#   node_labels  : extra Swarm node labels (placement constraints use them)
#
# The first host in `managers` is the bootstrap manager: it runs `swarm init`
# and every management playbook talks to it.
all:
  children:
    swarm_nodes:
      children:
        managers:
          hosts:
            dev-manager-1: # EC2 i-00c2d30693af6207c (us-east-1)
              ansible_host: 3.234.146.185
              swarm_addr: 172.31.3.29
        workers:
          hosts:
            dev-worker-1: # EC2 i-02758bcd140367b2b (us-east-1)
              ansible_host: 100.59.2.183
              swarm_addr: 172.31.11.235
              node_labels:
                tier: app
