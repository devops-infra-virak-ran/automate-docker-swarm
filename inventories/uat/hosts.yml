---
# UAT cluster — 1 manager + 2 workers (production-like topology for testing
# rolling updates across more than one worker).
all:
  children:
    swarm_nodes:
      children:
        managers:
          hosts:
            uat-manager-1:
              ansible_host: 192.168.57.11
              swarm_addr: 192.168.57.11
        workers:
          hosts:
            uat-worker-1:
              ansible_host: 192.168.57.12
              swarm_addr: 192.168.57.12
              node_labels:
                tier: app
            uat-worker-2:
              ansible_host: 192.168.57.13
              swarm_addr: 192.168.57.13
              node_labels:
                tier: app
