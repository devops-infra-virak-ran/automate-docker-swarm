---
- name: Set the hostname to the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Resolve the hostname locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Check for cloud-init
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg.d
  register: common_cloud_init

- name: Stop cloud-init resetting the hostname on reboot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
    content: "preserve_hostname: true\n"
    owner: root
    group: root
    mode: "0644"
  when: common_cloud_init.stat.exists
