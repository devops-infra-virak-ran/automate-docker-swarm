---
# Make the cluster match the inventory: a host listed under `managers` is a
# manager, anything else is a worker; labels = node_labels + env.
# Addressed by node ID, so it works even if the OS hostname is not unique.
- name: Set role and labels
  community.docker.docker_node:
    hostname: "{{ swarm_host.host_info.Swarm.NodeID }}"
    role: "{{ 'manager' if inventory_hostname in groups['managers'] else 'worker' }}"
    labels: "{{ {'env': env_name} | combine(node_labels) }}"
    labels_state: merge
  delegate_to: "{{ swarm_leader }}"
