---
- name: Check whether Docker is already installed
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary

- name: Install Docker CE from the official repository
  when: not docker_binary.stat.exists or docker_force_install | bool
  block:
    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
        signed_by: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"

    - name: Install Docker packages
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

- name: Install the Docker SDK for Python (used by the Ansible docker modules)
  ansible.builtin.apt:
    name: python3-docker
    state: present

- name: Read the current daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: docker_daemon_current
  failed_when: false

- name: Write daemon.json (merged with existing settings)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: >-
      {{ ((docker_daemon_current.content | b64decode | from_json) if docker_daemon_current.content is defined else {})
         | combine(docker_daemon_config, recursive=True) | to_nice_json }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: Start Docker and enable it at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# Apply a daemon.json change now, not at the end of the play, so the Swarm
# role that follows talks to the reconfigured daemon.
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
