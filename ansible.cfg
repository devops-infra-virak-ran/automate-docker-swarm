[defaults]
# Inventory is chosen per environment by the Makefile (-i inventories/<env>/hosts.yml).
roles_path = roles
filter_plugins = plugins/filter
collections_path = ./collections:~/.ansible/collections
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
display_skipped_hosts = False
# Never silently trust a host we have not seen before (see ssh_args below).
host_key_checking = True

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
# accept-new: pin the host key on first contact, refuse if it ever changes.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o PasswordAuthentication=no
