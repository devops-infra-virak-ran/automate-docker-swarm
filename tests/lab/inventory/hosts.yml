---
# Local lab (see tests/lab/up.sh). Same layout as a real environment.
# To rehearse node-add, uncomment lab-worker-3 and run: make node-add ENV=lab NODE=lab-worker-3
all:
  children:
    swarm_nodes:
      children:
        managers:
          hosts:
            lab-manager-1:
              ansible_host: lab-manager-1
              swarm_addr: 192.168.99.11
        workers:
          hosts:
            lab-worker-1:
              ansible_host: lab-worker-1
              swarm_addr: 192.168.99.12
              node_labels:
                tier: app
            lab-worker-2:
              ansible_host: lab-worker-2
              swarm_addr: 192.168.99.13
              node_labels:
                tier: app
