---
# Converge applications to their definitions in inventories/<env>/apps/.
#   make deploy ENV=dev            # every application
#   make deploy ENV=dev APP=web    # one application
# Apps whose definition says `state: absent` are removed.
- name: Deploy applications
  hosts: managers[0]
  become: true
  gather_facts: false
  tasks:
    - name: Load application definitions
      ansible.builtin.include_role:
        name: swarm_app
        tasks_from: catalog

    - name: Ensure the overlay network
      ansible.builtin.include_role:
        name: swarm_app
        tasks_from: network

    - name: Deploy
      ansible.builtin.include_role:
        name: swarm_app
        tasks_from: deploy
      loop: "{{ [app_name] if app_name | default('') | length > 0 else app_catalog.keys() | sort }}"
      loop_control:
        loop_var: swarm_app_name
